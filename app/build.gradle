plugins {
    id "com.android.application"
}

android {
    namespace "app.deta.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "app.deta.mobile"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "0.2.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
