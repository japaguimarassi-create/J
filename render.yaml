services:
  - type: web
    name: motionforge-cloud-backend
    runtime: python
    branch: motionforge-editor
    plan: free
    buildCommand: python -m py_compile cloud_backend.py
    startCommand: python cloud_backend.py
    healthCheckPath: /health
    envVars:
      - key: MOTIONFORGE_HOST
        value: 0.0.0.0
      - key: MOTIONFORGE_GITHUB_MODELS
        value: openai/gpt-4o
      - key: GITHUB_MODELS_TOKEN
        sync: false
      - key: MOTIONFORGE_API_KEY
        sync: false
