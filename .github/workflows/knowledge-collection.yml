name: Kowork public knowledge collection

on:
  push:
    branches:
      - kowork-android-app
      - kowork-universal-workspace
      - kowork-internet-knowledge
      - kowork-assistant-apk-rescue
    paths:
      - "ai/knowledge_sources.json"
      - "ai/collect_knowledge.py"
      - "ai/knowledge_index.py"
      - "tests/test_knowledge_pipeline.py"
      - "tests/test_internet_access.py"
      - ".github/workflows/knowledge-collection.yml"
  pull_request:
    branches:
      - kowork-android-app
      - kowork-universal-workspace
      - kowork-assistant-apk-rescue
  schedule:
    - cron: "19 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-and-index:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout knowledge pipeline
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "sentencepiece>=0.2.0"
          python -m pip install "torch>=2.5.1" --index-url https://download.pytorch.org/whl/cpu

      - name: Validate collector and local search
        run: python -m unittest discover -s tests -v

      - name: Collect bounded public documentation from the internet
        run: |
          python -m ai.collect_knowledge             --manifest ai/knowledge_sources.json             --output-dir data/knowledge             --max-pages-per-source 24             --max-total-mib 48             --max-page-mib 2             --max-depth 2             --delay 0.5

      - name: Build local searchable knowledge index
        run: |
          python -m ai.knowledge_index build             --documents data/knowledge/documents.jsonl             --output data/knowledge/knowledge.sqlite3

      - name: Verify the index can retrieve programming and game-development knowledge
        run: |
          python -m ai.knowledge_index search --index data/knowledge/knowledge.sqlite3 --query "Python functions classes" --limit 3
          python -m ai.knowledge_index search --index data/knowledge/knowledge.sqlite3 --query "Godot 2D game scripting physics" --limit 3
          python -m ai.knowledge_index search --index data/knowledge/knowledge.sqlite3 --query "Roblox Luau scripting" --limit 3

      - name: Upload corpus, index and provenance report
        uses: actions/upload-artifact@v4
        with:
          name: kowork-public-knowledge
          path: |
            data/knowledge/corpus.txt
            data/knowledge/documents.jsonl
            data/knowledge/documents/
            data/knowledge/knowledge.sqlite3
            data/knowledge/report.json
          if-no-files-found: error
          retention-days: 30
