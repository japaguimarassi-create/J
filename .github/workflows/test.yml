name: Lokivolt Migration Engine

on:
  push:
    branches:
      - main
      - lokivolt/migration-engine-v1
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: find migration os -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: OS metadata validation
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for p in [
              Path("os/config/identity-policy.json"),
              Path("os/config/reset-flow.json"),
              Path("os/images/MANIFEST.json"),
          ]:
              json.loads(p.read_text(encoding="utf-8"))
          ET.parse("os/packages/apps/LokivoltSetup/AndroidManifest.xml")
          ET.parse("os/packages/apps/LokivoltSetup/res/values/styles.xml")
          print("OS metadata valid")
          PY
      - name: Python suite
        run: python3 migration/tests/python/run_tests.py
      - name: Shell suite
        run: |
          bash migration/tests/shell/test_master.sh
          bash migration/tests/shell/test_device_discovery.sh
          bash migration/tests/shell/test_transactions.sh
          bash migration/tests/shell/test_vault.sh
          bash migration/tests/shell/test_platform_inspection.sh
          bash migration/tests/shell/test_profiles.sh
          bash migration/tests/shell/test_planner.sh
          bash migration/tests/shell/test_recovery.sh
          bash migration/tests/shell/test_release.sh
          bash migration/tests/shell/test_preflight.sh
          bash migration/tests/shell/test_jarvis_bridge.sh
          bash migration/tests/shell/test_cli.sh
      - name: Full self-check
        run: bash migration/tests/selfcheck.sh
