name: Build VoxMobs

on:
  push:
    branches:
      - voxmobs-1.20.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruct source package
        shell: bash
        run: |
          cat .voxmobs-source/part-*.b64 | base64 -d > "$RUNNER_TEMP/VoxMobs-1.20.1-source.tar.xz"
          xz -t "$RUNNER_TEMP/VoxMobs-1.20.1-source.tar.xz"
          tar -xJf "$RUNNER_TEMP/VoxMobs-1.20.1-source.tar.xz" -C "$RUNNER_TEMP"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Test and build Forge mod
        working-directory: ${{ runner.temp }}/VoxMobs-1.20.1
        run: gradle --no-daemon test build
      - uses: actions/upload-artifact@v4
        with:
          name: voxmobs-minecraft-forge-1.20.1
          path: |
            ${{ runner.temp }}/VoxMobs-1.20.1/build/libs/*-all.jar
            ${{ runner.temp }}/VoxMobs-1.20.1-source.tar.xz
          if-no-files-found: error
          retention-days: 30
