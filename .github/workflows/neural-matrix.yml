name: Neural Matrix CI

on:
  push:
    paths:
      - 'neural-matrix/**'
      - '.github/workflows/neural-matrix.yml'
  pull_request:
    paths:
      - 'neural-matrix/**'
      - '.github/workflows/neural-matrix.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ./neural-matrix
      - run: python -m unittest discover -s neural-matrix/tests -v
      - run: neural-matrix inspect
      - run: neural-matrix plan
      - name: Generate deterministic training data
        run: neural-matrix generate --output "$RUNNER_TEMP/neural-matrix-ci.jsonl" --samples 32 --width 32 --seed 17
      - name: Train a demo checkpoint
        run: neural-matrix --config neural-matrix/config.example.json train --data "$RUNNER_TEMP/neural-matrix-ci.jsonl" --checkpoint "$RUNNER_TEMP/neural-matrix-ci.json" --epochs 1 --batch-size 8 --mode incremental
      - name: Predict with the generated checkpoint
        run: |
          INPUT=$(python -c 'import json; print(json.dumps(json.loads(open("'"$RUNNER_TEMP"'/neural-matrix-ci.jsonl").readline())["x"]))')
          neural-matrix predict --checkpoint "$RUNNER_TEMP/neural-matrix-ci.json" --input "$INPUT"
      - name: Evaluate the generated checkpoint
        run: neural-matrix evaluate --checkpoint "$RUNNER_TEMP/neural-matrix-ci.json" --data "$RUNNER_TEMP/neural-matrix-ci.jsonl"
