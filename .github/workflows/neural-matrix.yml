name: Neural Matrix CI

on:
  push:
    paths:
      - 'neural-matrix/**'
      - '.github/workflows/neural-matrix.yml'
  pull_request:
    paths:
      - 'neural-matrix/**'
      - '.github/workflows/neural-matrix.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./neural-matrix
      - run: python -m unittest discover -s neural-matrix/tests -v
      - run: neural-matrix inspect
