name: Build Chat Reality 3D Android APK

on:
  push:
    branches:
      - chat-reality-3d-apk
    paths:
      - "chatreality/**"
      - ".github/workflows/build-chat-reality-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reassemble source archive
        shell: bash
        run: |
          set -euo pipefail
          cat chatreality/source_parts/part*.b64 > chatreality/source.zip.b64
          base64 --decode chatreality/source.zip.b64 > chatreality/source.zip
          unzip -t chatreality/source.zip
          unzip -q chatreality/source.zip
          test -f ChatReality3D/project.godot
          python3 - <<'PY'
          from pathlib import Path
          parser = Path("ChatReality3D/scripts/parser.gd")
          source = parser.read_text()
          old_number = """func _find_number(tokens: PackedStringArray) -> int:
          	var numbers: Dictionary = dictionaries.get("parameters", {}).get("numbers", {})
          	for token in tokens:
          		if token.is_valid_int():
          			return int(token)
          		if numbers.has(token):
          			return int(numbers[token])
          	return 1
          """
          new_number = """func _find_number(tokens: PackedStringArray) -> int:
          	var numbers: Dictionary = dictionaries.get("parameters", {}).get("numbers", {})
          	for token in tokens:
          		if token.is_valid_int():
          			return int(token)
          	for token in tokens:
          		if numbers.has(token):
          			return int(numbers[token])
          	return 1
          """
          if old_number not in source:
              raise SystemExit("Could not find expected _find_number implementation")
          parser.write_text(source.replace(old_number, new_number))
          entities = Path("ChatReality3D/scripts/gerador_entidades.gd")
          entity_source = entities.read_text()
          if "ConeMesh.new()" not in entity_source:
              raise SystemExit("Could not find expected ConeMesh constructor")
          entity_source = entity_source.replace("ConeMesh.new()", "CylinderMesh.new()")
          entity_source = entity_source.replace("		ear_mesh.bottom_radius = 0.15", "		ear_mesh.top_radius = 0.0\n\t\tear_mesh.bottom_radius = 0.15")
          entities.write_text(entity_source)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android export requirements
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates"
          curl -fL --retry 4 --retry-delay 3 \
            "https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          ln -sf "$GODOT_BIN" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          curl -fL --retry 4 --retry-delay 3 \
            "https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=export_templates.tpz" \
            -o "$RUNNER_TEMP/export_templates.tpz"
          unzip -q "$RUNNER_TEMP/export_templates.tpz" -d "$RUNNER_TEMP/templates"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          if [ -d "$RUNNER_TEMP/templates/templates" ]; then
            cp -a "$RUNNER_TEMP/templates/templates/." "$TEMPLATE_DIR/"
          else
            cp -a "$RUNNER_TEMP/templates/." "$TEMPLATE_DIR/"
          fi
          printf '%s\n' '4.7.2.stable' > "$TEMPLATE_DIR/version.txt"
          test -s "$TEMPLATE_DIR/android_debug.apk"

      - name: Configure Godot Android paths and debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import, test parser and boot scene
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          set +e
          timeout 180s godot --headless --editor --path ChatReality3D --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          import_status=${PIPESTATUS[0]}
          set -e
          if [ "$import_status" -ne 0 ] || grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" "$RUNNER_TEMP/godot-import.log"; then
            exit 1
          fi
          set +e
          timeout 45s godot --headless --path ChatReality3D --script res://tests/parser_smoke.gd --quit-after 30 2>&1 | tee "$RUNNER_TEMP/parser-smoke.log"
          parser_status=${PIPESTATUS[0]}
          set -e
          if [ "$parser_status" -ne 0 ] || grep -Eiq "SCRIPT ERROR|Assertion failed|Parse Error|Compile Error|ERROR:" "$RUNNER_TEMP/parser-smoke.log"; then
            exit 1
          fi
          set +e
          timeout 45s godot --headless --path ChatReality3D --quit-after 4 2>&1 | tee "$RUNNER_TEMP/godot-boot.log"
          boot_status=${PIPESTATUS[0]}
          set -e
          if [ "$boot_status" -ne 0 ] || grep -Eiq "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" "$RUNNER_TEMP/godot-boot.log"; then
            exit 1
          fi

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ChatReality3D/build
          godot --headless --path ChatReality3D --export-debug "Android" ChatReality3D/build/ChatReality3D.apk
          test -s ChatReality3D/build/ChatReality3D.apk
          unzip -t ChatReality3D/build/ChatReality3D.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose ChatReality3D/build/ChatReality3D.apk
          sha256sum ChatReality3D/build/ChatReality3D.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatReality3D-Android-APK
          path: ChatReality3D/build/ChatReality3D.apk
          if-no-files-found: error
          retention-days: 14
