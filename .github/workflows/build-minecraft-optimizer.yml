name: Build Nexus Optimizer 1.20.1

on:
  push:
    branches:
      - minecraft-optimizer-1.20.1
    paths:
      - 'optimizer/**'
      - '.github/workflows/build-minecraft-optimizer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build reobfuscated mod JAR
        working-directory: optimizer
        run: gradle build --no-daemon

      - name: Upload final JAR
        uses: actions/upload-artifact@v4
        with:
          name: nexus-optimizer-1.20.1
          path: optimizer/build/libs/nexusoptimizer-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
