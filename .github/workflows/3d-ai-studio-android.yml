name: 3D AI Studio — sandbox, verification and Android APK

on:
  push:
    branches:
      - "3d-ai-studio/**"
    paths:
      - "3d-ai-studio/**"
      - "training-sandbox/**"
      - ".github/workflows/3d-ai-studio-android.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  sandbox-train:
    name: Train and validate isolated 3D sandbox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run sandbox from scratch
        run: node training-sandbox/train.mjs
      - name: Upload sandbox dataset and model checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: 3d-ai-training-sandbox
          path: training-sandbox/generated/
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Typecheck, tests and web build
    needs: sandbox-train
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3d-ai-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download trained checkpoint only
        uses: actions/download-artifact@v4
        with:
          name: 3d-ai-training-sandbox
          path: /tmp/3d-ai-training-sandbox
      - name: Install model checkpoint into app assets
        run: |
          mkdir -p public/models
          cp /tmp/3d-ai-training-sandbox/scene-brain.json public/models/scene-brain.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify project
        run: npm run verify

  android:
    name: Build Android debug APK
    needs: [sandbox-train, verify]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3d-ai-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download trained checkpoint only
        uses: actions/download-artifact@v4
        with:
          name: 3d-ai-training-sandbox
          path: /tmp/3d-ai-training-sandbox
      - name: Install model checkpoint into app assets
        run: |
          mkdir -p public/models
          cp /tmp/3d-ai-training-sandbox/scene-brain.json public/models/scene-brain.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eu
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --licenses >/dev/null <<'LICENSES'
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          LICENSES
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Create Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Assemble APK
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 3d-ai-studio-debug-apk
          path: 3d-ai-studio/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
