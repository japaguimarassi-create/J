name: VoxMobs Forge 1.20.1

on:
  push:
    branches: [voxmobs-1.20.1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete source tree
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G ".bootstrap/part-*.b64" > /dev/null; then
            cat .bootstrap/part-*.b64 | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/voxmobs-source.tar.xz"
            tar -xJf "$RUNNER_TEMP/voxmobs-source.tar.xz" --strip-components=1 -C "$GITHUB_WORKSPACE"
            rm -rf .bootstrap
            test -f settings.gradle
            test -f build.gradle
            test -f gradle/wrapper/gradle-wrapper.properties
            test -f src/main/resources/META-INF/mods.toml
            test -n "$(find src/main/java -name '*.java' -print -quit)"
            chmod +x ./gradlew
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Restore complete VoxMobs 1.20.1 Forge source tree [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate project layout
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f src/main/resources/META-INF/mods.toml
          count="$(find src/main/java -name '*.java' | wc -l)"
          echo "Java source files: $count"
          test "$count" -ge 25
          chmod +x ./gradlew

      - name: Run tests and build Forge mod
        run: ./gradlew --no-daemon clean test build

      - name: Audit installable mod JAR
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if (( ${#jars[@]} == 0 )); then
            echo "No JAR was generated by Gradle." >&2
            exit 1
          fi
          candidate=""
          for jar in "${jars[@]}"; do
            case "$jar" in *-all.jar|*-jarjar.jar) candidate="$jar"; break ;; esac
          done
          if [[ -z "$candidate" ]]; then candidate="${jars[0]}"; fi
          mkdir -p reports
          python3 tools/audit_jar.py "$candidate" --json reports/jar-audit.json --markdown reports/jar-audit.md
          jar tf "$candidate" | grep -qx 'META-INF/mods.toml'
          jar tf "$candidate" | grep -qx 'io/github/japaguimarassi/voxmobs/VoxMobs.class'
          echo "jar_path=$candidate" >> "$GITHUB_OUTPUT"
          echo "Installable JAR passed structural audit: $candidate"

      - name: Upload verified mod
        uses: actions/upload-artifact@v4
        with:
          name: VoxMobs-Forge-1.20.1
          path: ${{ steps.audit.outputs.jar_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload audit and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoxMobs-build-reports
          path: |
            reports/**
            build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 30
