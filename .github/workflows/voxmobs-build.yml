name: VoxMobs Forge Build

on:
  push:
    branches:
      - voxmobs-1.20.1
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Forge mod
        run: ./gradlew --no-daemon clean build

      - name: Publish Forge mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: VoxMobs-Forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
