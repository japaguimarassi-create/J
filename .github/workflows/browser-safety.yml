name: Kowork browser safety tests

on:
  push:
    branches:
      - kowork-universal-workspace
    paths:
      - "ai/tools/browser.py"
      - "tests/test_browser_tool.py"
      - "tests/__init__.py"
      - ".github/workflows/browser-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run browser URL safety tests
        run: python -m unittest tests.test_browser_tool -v
