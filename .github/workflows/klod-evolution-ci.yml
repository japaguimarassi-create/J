name: KLOD Evolution CI
on:
  push:
    paths:
      - 'klod-evolution/**'
      - '.github/workflows/klod-evolution-ci.yml'
  pull_request:
    paths:
      - 'klod-evolution/**'
      - '.github/workflows/klod-evolution-ci.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r klod-evolution/requirements.txt
      - run: PYTHONPATH=klod-evolution pytest -q klod-evolution/tests
      - name: Generate dense target resource plan
        run: |
          PYTHONPATH=klod-evolution python -m klod.shard_plan \
            --out "$RUNNER_TEMP/klod-shard-plan.json"
      - name: Train each independent specialist with micro profile
        run: |
          PYTHONPATH=klod-evolution python -m klod.train_shards \
            --manifest klod-evolution/config/shards.json \
            --profile micro \
            --steps 2 \
            --batch-size 2 \
            --seq-len 16 \
            --device cpu \
            --checkpoint-dir "$RUNNER_TEMP/klod-shards" \
            --report "$RUNNER_TEMP/shard-training-report.json"
      - name: Load and route all trained specialist checkpoints
        run: |
          PYTHONPATH=klod-evolution python -m klod.shard_runtime \
            --manifest klod-evolution/config/shards.json \
            --checkpoint-dir "$RUNNER_TEMP/klod-shards" \
            --device cpu \
            --smoke
      - name: Train a checkpoint with validation and early stopping
        run: |
          PYTHONPATH=klod-evolution python -m klod.train \
            --data klod-evolution/data/bootstrap.txt \
            --steps 3 \
            --batch-size 2 \
            --seq-len 12 \
            --layers 1 \
            --width 32 \
            --heads 2 \
            --experts 2 \
            --eval-every 1 \
            --patience 2 \
            --out "$RUNNER_TEMP/klod-trained.pt"
      - name: Benchmark trained checkpoint
        run: |
          PYTHONPATH=klod-evolution python -m klod.benchmarks \
            --checkpoint "$RUNNER_TEMP/klod-trained.pt" \
            --data klod-evolution/data/benchmark.jsonl \
            --out "$RUNNER_TEMP/training-benchmark.json" \
            --max-new-tokens 8
      - name: Run two generations of task-aware architecture selection
        run: |
          PYTHONPATH=klod-evolution python -m klod.evolution \
            --data klod-evolution/data/bootstrap.txt \
            --benchmark-data klod-evolution/data/benchmark.jsonl \
            --generations 2 \
            --population 2 \
            --elite-count 1 \
            --steps 3 \
            --batch-size 2 \
            --seq-len 12 \
            --benchmark-tokens 8 \
            --timeout 120 \
            --checkpoint-dir "$RUNNER_TEMP/klod-candidates" \
            --out "$RUNNER_TEMP/evolution-report.json" \
            --promote \
            --promoted-checkpoint "$RUNNER_TEMP/klod-evolved.pt"
