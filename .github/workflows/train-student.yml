name: Train MotionForge student

on:
  push:
    branches: [motionforge-editor]
    paths:
      - 'ai/**'
      - 'data/seed_examples.jsonl'
      - 'tests/**'
      - '.github/workflows/train-student.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install --upgrade pip && pip install -r ai/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/forge.test.mjs
      - run: python ai/train.py --steps 160 --batch-size 4 --output models/motionforge-student.pt
      - uses: actions/upload-artifact@v4
        with:
          name: motionforge-student-${{ github.sha }}
          path: |
            models/motionforge-student.pt
            models/motionforge-student.metrics.json
          if-no-files-found: error
          retention-days: 30
