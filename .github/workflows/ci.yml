name: Python CI

on:
  push:
    branches:
      - main
      - deta-ai-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q deta tests
      - name: Static checks
        run: python -m ruff check --select E4,E7,E9,F401,F63,F7,F82 deta tests
      - name: Smoke-test model shape and parameter count
        run: python -m deta.cli count-params
      - name: Run unit tests
        run: python -m pytest -q
