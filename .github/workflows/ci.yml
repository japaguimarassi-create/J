name: MotionForge checks
on:
  push:
    branches: ["main", "motionforge-editor"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test FORGE parser and timeline
        run: node --test tests/test_forge.mjs
      - name: Check Python syntax
        run: python -m py_compile server.py ai/student.py ai/train.py
      - name: Verify exact student parameter count
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m ai.student
