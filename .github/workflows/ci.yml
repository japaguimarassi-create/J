name: Deta CI and staged training

on:
  push:
    branches:
      - main
      - deta-ai-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q deta tests scripts
      - name: Static checks
        run: python -m ruff check --select E4,E7,E9,F401,F63,F7,F82 deta tests scripts
      - name: Check model parameter budget
        run: python -m deta.cli count-params
      - name: Run unit tests
        run: python -m pytest -q

  train-groups:
    if: github.event_name == 'push' && github.ref == 'refs/heads/deta-ai-foundation' && contains(github.event.head_commit.message, '[train-deta]')
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install training dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Collect an approved, bounded code corpus
        run: python scripts/build_training_corpus.py --output data/approved.jsonl --max-files-per-repo 12 --min-records 8
      - name: Train five 80k groups sequentially
        run: python -m deta.cli train --data data/approved.jsonl --output-dir checkpoints/deta-400k --steps-per-group 1000 --start-group 1 --end-group 5 --seed 42 --max-bytes 67108864
      - name: Upload per-group and final checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deta-400k-five-group-checkpoints
          path: |
            checkpoints/deta-400k/
            data/approved.report.json
          if-no-files-found: warn
          retention-days: 30
