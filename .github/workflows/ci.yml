name: Deta CI and staged training

on:
  push:
    branches:
      - main
      - deta-ai-foundation
      - deta-mobile-integrated
  pull_request:
  workflow_dispatch:

concurrency:
  group: deta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned CPU-only PyTorch and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python -m pip install -e ".[dev]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q deta tests scripts
      - name: Static checks
        run: python -m ruff check --select E4,E7,E9,F401,F63,F7,F82 deta tests scripts
      - name: Check model parameter budget
        run: python -m deta.cli count-params
      - name: Run unit tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Smoke-test generated project files
        run: |
          python -m deta.cli create-project --kind browser-game --name "CI Browser Game" --output "$RUNNER_TEMP/deta-browser-game"
          python -m deta.cli create-project --kind social-app --name "CI Social App" --output "$RUNNER_TEMP/deta-social-app"
          python -m deta.cli create-project --kind python-cli --name "CI Task CLI" --output "$RUNNER_TEMP/deta-python-cli"
          node --check "$RUNNER_TEMP/deta-browser-game/game.js"
          node --check "$RUNNER_TEMP/deta-social-app/app.js"
          python -m compileall -q "$RUNNER_TEMP/deta-python-cli"

  android-compile-test:
    if: github.ref == 'refs/heads/deta-mobile-integrated'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check Android source and compile Java without packaging an APK
        run: |
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/app/deta/mobile/MainActivity.java
          gradle --no-daemon --stacktrace :app:compileDebugJavaWithJavac

  android-build:
    if: github.ref == 'refs/heads/deta-mobile-integrated'
    needs: [tests, android-compile-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Android files
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/drawable/ic_deta_foreground.xml
      - name: Package the tested Deta APK
        run: gradle --no-daemon --stacktrace clean assembleDebug
      - name: Verify alignment, signature, ZIP integrity, and package identity
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS_DIR/apksigner"
          test -x "$BUILD_TOOLS_DIR/aapt"
          test -x "$BUILD_TOOLS_DIR/zipalign"
          "$BUILD_TOOLS_DIR/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS_DIR/aapt" dump badging "$APK" | tee /tmp/deta-apk-badging.txt
          grep -F "package: name='app.deta.mobile.debug' versionCode='1' versionName='0.1.0-debug'" /tmp/deta-apk-badging.txt
          unzip -t "$APK"
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Upload final installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deta-android-debug-apk-final
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  train-groups:
    if: github.event_name == 'push' && github.ref == 'refs/heads/deta-ai-foundation' && contains(github.event.head_commit.message, '[train-deta]')
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned CPU-only PyTorch and training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python -m pip install -e ".[dev]"
      - name: Download the previous trained five-group model
        uses: actions/download-artifact@v4
        with:
          name: deta-400k-five-group-checkpoints
          path: previous-model
          repository: ${{ github.repository }}
          run-id: 39685570913
          github-token: ${{ github.token }}
      - name: Locate previous model checkpoint
        run: |
          INITIAL_WEIGHTS="$(find previous-model -type f -name final.pt -print -quit)"
          test -n "$INITIAL_WEIGHTS"
          test -s "$INITIAL_WEIGHTS"
          echo "DETA_INITIAL_WEIGHTS=$INITIAL_WEIGHTS" >> "$GITHUB_ENV"
      - name: Collect an approved, bounded code corpus
        run: python scripts/build_training_corpus.py --output data/approved.jsonl --max-files-per-repo 20 --min-records 150
      - name: Fine-tune the existing model in five sequential groups
        run: python -m deta.cli train --data data/approved.jsonl --output-dir checkpoints/deta-400k --steps-per-group 5000 --start-group 1 --end-group 5 --initial-weights "$DETA_INITIAL_WEIGHTS" --seed 42 --max-bytes 67108864
      - name: Upload per-group and final checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deta-400k-five-group-checkpoints
          path: |
            checkpoints/deta-400k/
            data/approved.jsonl
            data/approved.report.json
          if-no-files-found: warn
          retention-days: 30
