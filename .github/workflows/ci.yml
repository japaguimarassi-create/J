name: MotionForge checks
on:
  push:
    branches: ["main", "motionforge-editor"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && pip install -r requirements.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: FORGE grammar and corpus tests
        run: node --test tests/test_forge.mjs
      - name: Check browser JavaScript syntax
        run: node --check web/app.js
      - name: Syntax checks
        run: python -m py_compile server.py ai/student.py ai/assistant.py ai/train.py
      - name: Verify exact student parameter count
        run: python -m ai.student
