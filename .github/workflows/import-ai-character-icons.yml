name: Import final AI character icons

on:
  push:
    branches:
      - demon-slayer-rpg-alpha
    paths:
      - "assets/character-select/AI-GENERATED-VERSION.md"
      - ".github/workflows/import-ai-character-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download generated portraits
        env:
          TANJIRO_URL: "https://im.runware.ai/image/os/a02d21/ws/3/ii/1dc754af-2c64-4ce0-b5e1-bce7feaca9c3.jpg"
          MUZAN_URL: "https://im.runware.ai/image/os/a02d21/ws/3/ii/cfe73276-75f7-4a26-8eca-a8887c6f1f18.jpg"
        run: |
          set -euo pipefail
          mkdir -p assets/character-select
          curl --fail --location --retry 4 --retry-delay 2 "$TANJIRO_URL" -o assets/character-select/tanjiro-roblox-icon-final.jpg
          curl --fail --location --retry 4 --retry-delay 2 "$MUZAN_URL" -o assets/character-select/muzan-roblox-icon-final.jpg
          test -s assets/character-select/tanjiro-roblox-icon-final.jpg
          test -s assets/character-select/muzan-roblox-icon-final.jpg

      - name: Verify images and make side-by-side preview
        run: |
          python -m pip install pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps

          root = Path("assets/character-select")
          names = [
              ("tanjiro-roblox-icon-final.jpg", "TANJIRO", "GUARDIÃO", "#124653", "#54d2d0"),
              ("muzan-roblox-icon-final.jpg", "MUZAN", "CRIATURA", "#421424", "#ec6477"),
          ]
          images = []
          for filename, title, faction, bg, accent in names:
              path = root / filename
              image = Image.open(path).convert("RGB")
              if image.width < 768 or image.height < 768:
                  raise SystemExit(f"Image resolution too small: {filename} {image.size}")
              if image.width != image.height:
                  raise SystemExit(f"Image must be square: {filename} {image.size}")
              image.save(path, quality=95, optimize=True)
              images.append(image)
              print(f"PASS {filename}: {image.width}x{image.height}")

          canvas = Image.new("RGB", (1120, 660), "#101116")
          draw = ImageDraw.Draw(canvas)
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          title_font = ImageFont.truetype(font_path, 30)
          faction_font = ImageFont.truetype(font_path, 20)
          header_font = ImageFont.truetype(font_path, 26)
          draw.text((560, 22), "ECLIPSE  /  ESCOLHA SUA FACÇÃO", font=header_font, fill="#f0dfbf", anchor="mm")

          for image, meta, x in zip(images, names, (45, 575)):
              filename, title, faction, bg, accent = meta
              x1, y1, x2, y2 = x, 58, x + 500, 630
              draw.rounded_rectangle((x1, y1, x2, y2), radius=28, fill=bg, outline=accent, width=5)
              draw.rounded_rectangle((x1 + 11, y1 + 11, x2 - 11, y2 - 11), radius=20, outline="#eadbbd", width=2)
              portrait = ImageOps.fit(image, (460, 460), method=Image.Resampling.LANCZOS)
              canvas.paste(portrait, (x + 20, 83))
              draw = ImageDraw.Draw(canvas)
              draw.rounded_rectangle((x + 80, 548, x + 420, 612), radius=16, fill="#f1e3c9", outline="#171419", width=5)
              draw.text((x + 250, 571), title, font=title_font, fill="#231a18", anchor="mm")
              draw.text((x + 250, 596), faction, font=faction_font, fill="#514039", anchor="mm")

          preview = root / "selection-preview-ai.png"
          canvas.save(preview, optimize=True)
          check = Image.open(preview)
          if check.size != (1120, 660):
              raise SystemExit(f"Invalid preview size: {check.size}")
          print("PASS selection-preview-ai.png: 1120x660")
          PY

      - name: Commit final AI portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/character-select/tanjiro-roblox-icon-final.jpg assets/character-select/muzan-roblox-icon-final.jpg assets/character-select/selection-preview-ai.png
          git diff --cached --quiet && exit 0
          git commit -m "Add final AI-generated faction portraits"
          git pull --rebase origin demon-slayer-rpg-alpha
          git push
