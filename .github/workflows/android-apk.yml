name: Kowork Android APK

on:
  push:
    branches:
      - kowork-android-app
      - kowork-universal-workspace
      - kowork-assistant-apk-rescue
      - kowork-apk-repaired
  pull_request:
    branches:
      - kowork-android-app
      - kowork-universal-workspace
      - kowork-assistant-apk-rescue
      - kowork-apk-repaired
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kowork-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compile debug and release APKs
        run: gradle --no-daemon --stacktrace --warning-mode all assembleDebug assembleRelease

      - name: Verify APK outputs and hashes
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kowork-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: kowork-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest
