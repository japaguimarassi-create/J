name: Deta Android APK

on:
  push:
    branches:
      - deta-ai-foundation
    paths:
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
      - "app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: deta-v1-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Deta source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate Android project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/app/deta/mobile/MainActivity.java

      - name: Run Android unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK structure, signature, and package identity
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS_DIR/apksigner"
          test -x "$BUILD_TOOLS_DIR/aapt"
          test -x "$BUILD_TOOLS_DIR/zipalign"
          "$BUILD_TOOLS_DIR/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS_DIR/aapt" dump badging "$APK" | tee /tmp/deta-apk-badging.txt
          grep -F "package: name='app.deta.mobile.debug' versionCode='100' versionName='1.0.0-debug'" /tmp/deta-apk-badging.txt
          unzip -t "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deta-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Launch app in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: gradle --no-daemon --stacktrace connectedDebugAndroidTest

