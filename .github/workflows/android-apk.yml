name: Deta rebuilt base APK

on:
  push:
    branches:
      - deta-ai-foundation
    paths:
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
      - "app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: deta-rebuilt-base-v9-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify clean native-only source
        run: |
          test -f app/src/main/java/app/deta/mobile/MainActivity.java
          test -f app/src/main/AndroidManifest.xml
          test -f archive/menu-v1/MainActivity.java
          test -f docs/DETA_REBUILD_MINDMAP.md
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! test -f app/src/main/java/app/deta/mobile/WebSearch.java
          ! grep -R -nE 'OpenAI|Gemini|API_KEY|https?://' app/src/main/java/app/deta/mobile || true

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build from clean state
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK alignment, signature, package identity, and archive
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS_DIR/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS_DIR/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/deta-badging.txt"
          grep -F "package: name='app.deta.mobile.debug' versionCode='110' versionName='1.1.0-debug'" "$RUNNER_TEMP/deta-badging.txt"
          unzip -t "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: deta-rebuilt-base-1.1.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
