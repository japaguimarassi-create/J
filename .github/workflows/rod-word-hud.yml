name: Rod Word HUD Android APK

on:
  push:
    branches:
      - rod-word-hud
    paths:
      - "RodWordHUD/**"
      - ".github/workflows/rod-word-hud.yml"
  pull_request:
    paths:
      - "RodWordHUD/**"
      - ".github/workflows/rod-word-hud.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compile debug APK
        run: gradle --no-daemon -p RodWordHUD :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rod-word-hud-debug-apk
          path: RodWordHUD/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
