name: Forge 1.7.10 build

on:
  push:
    branches:
      - reality-engine-ai
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Set up Gradle 5.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '5.6.4'
      - name: Compile and test
        run: gradle --no-daemon clean test build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealityEngineAI-1.7.10
          path: build/libs/RealityEngineAI-*.jar
          if-no-files-found: error
