name: IntX 1.7.10 build

on:
  push:
    branches: [intx-1.7.10]
  pull_request:
    branches: [intx-1.7.10]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Set up Gradle 5.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "5.6.4"
      - name: Decompile workspace, test, and build
        run: gradle --no-daemon setupDecompWorkspace test build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: intx-forge-1.7.10
          path: build/libs/*.jar
          if-no-files-found: error
