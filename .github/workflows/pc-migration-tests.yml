name: PC migration tests

on:
  push:
    branches:
      - pc-linux-migration/aoc-preservation-v1
  pull_request:
    paths:
      - "pc-linux-migration/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s pc-linux-migration/tests -v
      - run: python -m py_compile pc-linux-migration/migrate.py
      - run: bash -n pc-linux-migration/usb/make_boot_usb.sh
