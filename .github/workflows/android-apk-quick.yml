name: Kowork APK quick build

on:
  push:
    branches:
      - kowork-apk-repaired
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kowork-apk-quick-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload debug APK before tests
        uses: actions/upload-artifact@v4
        with:
          name: kowork-debug-apk-quick
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest
