name: DualLong HyperCore CI

on:
  push:
    branches:
      - feature/dual-long-hypercore-1.7.10
    paths:
      - dual-long-hypercore/**
      - .github/workflows/dual-long-hypercore.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.9.1'
      - name: Extract project source
        run: tar -xJf dual-long-hypercore/DualLongHyperCore-0.1.0-source.tar.xz -C "$RUNNER_TEMP"
      - name: Run tests and build mod
        run: cd "$RUNNER_TEMP/DualLongHyperCore" && gradle clean test build --no-daemon
      - name: Upload build outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DualLongHyperCore-0.1.0
          path: ${{ runner.temp }}/DualLongHyperCore/build/libs/*.jar
          if-no-files-found: error
