name: Render and verify character selection artwork

on:
  push:
    branches:
      - demon-slayer-rpg-alpha
    paths:
      - "assets/character-select/*.svg"
      - ".github/workflows/render-character-selection.yml"
  workflow_dispatch:

concurrency:
  group: character-selection-art-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer
        run: python -m pip install cairosvg pillow

      - name: Render transparent portraits and button preview
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          root = Path("assets/character-select")
          names = ["tanjiro-bacon", "muzan-bacon"]
          images = []

          for name in names:
              source = root / f"{name}.svg"
              target = root / f"{name}.png"
              cairosvg.svg2png(
                  url=str(source),
                  write_to=str(target),
                  output_width=1024,
                  output_height=1024
              )
              image = Image.open(target).convert("RGBA")
              if image.size != (1024, 1024):
                  raise SystemExit(f"Unexpected image size: {target} {image.size}")
              if image.getchannel("A").getextrema()[0] != 0:
                  raise SystemExit(f"Portrait must have transparent background: {target}")
              images.append(image)

          sheet = Image.new("RGBA", (1120, 650), "#111217")
          cards = [
              (45, 40, 505, 590, "#16414b", "#41cfc9", "TANJIRO", "GUARDIÃO"),
              (570, 40, 1030, 590, "#411422", "#ef5a70", "MUZAN", "CRIATURA"),
          ]
          font = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          title_font = ImageFont.truetype(font, 28)
          label_font = ImageFont.truetype(font, 22)

          for image, card in zip(images, cards):
              x1, y1, x2, y2, background, accent, title, label = card
              draw = ImageDraw.Draw(sheet)
              draw.rounded_rectangle((x1, y1, x2, y2), radius=30, fill=background, outline=accent, width=4)
              draw.rounded_rectangle((x1 + 12, y1 + 12, x2 - 12, y2 - 12), radius=23, outline="#ebddbf", width=2)

              center = (x1 + x2) // 2
              glow = Image.new("RGBA", sheet.size, (0, 0, 0, 0))
              accent_rgb = Image.new("RGB", (1, 1), accent).getpixel((0, 0))
              ImageDraw.Draw(glow).ellipse((center - 190, 115, center + 190, 495), fill=(*accent_rgb, 55))
              sheet = Image.alpha_composite(sheet, glow.filter(ImageFilter.GaussianBlur(55)))

              portrait = image.resize((450, 450), Image.Resampling.LANCZOS)
              sheet.alpha_composite(portrait, (center - 225, 89))
              draw = ImageDraw.Draw(sheet)
              draw.text((center, 67), title, font=title_font, fill="#fff6e5", anchor="mm")
              draw.rounded_rectangle((x1 + 55, 520, x2 - 55, 575), radius=16, fill="#f2e1be", outline="#191618", width=5)
              draw.text((center, 546), label, font=label_font, fill="#251b18", anchor="mm")

          sheet.convert("RGB").save(root / "selection-preview.png", optimize=True)
          print("Rendered 2 transparent portrait PNGs and the faction button preview.")
          PY

      - name: Verify SVG and PNG outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from PIL import Image

          root = Path("assets/character-select")
          for name in ("tanjiro-bacon", "muzan-bacon"):
              ET.parse(root / f"{name}.svg")
              image = Image.open(root / f"{name}.png")
              image.verify()
              image = Image.open(root / f"{name}.png").convert("RGBA")
              assert image.size == (1024, 1024), f"Bad size: {name}"
              assert image.getchannel("A").getextrema()[0] == 0, f"Missing transparency: {name}"
              print(f"PASS {name}: valid SVG, transparent 1024x1024 PNG")

          preview = Image.open(root / "selection-preview.png")
          preview.verify()
          assert preview.size == (1120, 650), "Unexpected preview dimensions"
          print("PASS preview: 1120x650")
          PY

      - name: Upload rendered artwork
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-character-selection-art
          path: assets/character-select/*.png
          if-no-files-found: error

      - name: Commit PNG exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/character-select/*.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Render revised faction selection portraits"
          git pull --rebase origin demon-slayer-rpg-alpha
          git push
