name: HyperCode training tests

on:
  push:
    paths:
      - "hypercode-ai/training/**"
      - "hypercode-ai/tests/**"
      - ".github/workflows/hypercode-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU PyTorch and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest pyarrow tokenizers

      - name: Run architecture tests
        run: python -m pytest hypercode-ai/tests -q

      - name: Run smoke training
        working-directory: hypercode-ai/training
        run: python train.py --profile smoke --data seed_corpus.jsonl.gz --steps 3 --batch-size 1 --output /tmp/hypercode-ci-smoke

      - name: Run smoke supervised fine-tuning
        working-directory: hypercode-ai/training
        run: python finetune.py --checkpoint /tmp/hypercode-ci-smoke/hyperinter_checkpoint.pt --data seed_instructions.jsonl.gz --steps 1 --batch-size 1 --output /tmp/hypercode-ci-sft

      - name: Run progressive seven-network training pipeline
        working-directory: hypercode-ai/training
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT=/tmp/hypercode-staged
          CHECKPOINT=""
          for INDEX in 0 1 2 3 4 5 6; do
            LABEL=$(printf "%02d" "$((INDEX + 1))")
            ARGS=(--profile smoke --stage expert --expert-index "$INDEX" --data seed_corpus.jsonl.gz --output "$OUTPUT" --steps 2 --batch-size 1 --validation-batches 2 --save-every 1 --log-every 2 --allow-validation-regression)
            if [ -n "$CHECKPOINT" ]; then
              ARGS+=(--checkpoint "$CHECKPOINT")
            fi
            python staged_train.py "${ARGS[@]}"
            CHECKPOINT="$OUTPUT/expert_${LABEL}/hyperinter_expert_${LABEL}.pt"
          done
          python staged_train.py --profile smoke --stage core --data seed_corpus.jsonl.gz --checkpoint "$CHECKPOINT" --output "$OUTPUT" --steps 3 --batch-size 1 --validation-batches 2 --save-every 1 --log-every 3 --allow-validation-regression
          CHECKPOINT="$OUTPUT/core/hyperinter_core.pt"
          python staged_train.py --profile smoke --stage communication --data seed_corpus.jsonl.gz --checkpoint "$CHECKPOINT" --output "$OUTPUT" --steps 3 --batch-size 1 --validation-batches 2 --save-every 1 --log-every 3 --allow-validation-regression
          CHECKPOINT="$OUTPUT/communication/hyperinter_communication.pt"
          python staged_train.py --profile smoke --stage joint --data seed_corpus.jsonl.gz --checkpoint "$CHECKPOINT" --output "$OUTPUT" --steps 4 --batch-size 1 --validation-batches 2 --save-every 1 --log-every 2 --allow-validation-regression
          python evaluate.py --checkpoint "$OUTPUT/joint/hyperinter_joint.pt" --tasks coding_benchmark.jsonl --output "$OUTPUT/final-evaluation" --generate --max-new-tokens 8

      - name: Upload fused model and training evidence
        uses: actions/upload-artifact@v4
        with:
          name: hyperinter-fusion-smoke-${{ github.sha }}
          path: /tmp/hypercode-staged
          if-no-files-found: error
          retention-days: 30
