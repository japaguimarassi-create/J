name: Klod CI

on:
  push:
    branches: [klod-development]
    paths:
      - 'klod/**'
      - '.github/workflows/klod-ci.yml'
  pull_request:
    branches: [klod-development]
    paths:
      - 'klod/**'
      - '.github/workflows/klod-ci.yml'
  workflow_dispatch:
    inputs:
      build_android_candidate:
        description: Build and install the APK candidate only after release gates 1–11 pass
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klod_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d klod_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/klod_test
      KLOD_SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: klod/pyproject.toml
      - name: Install backend
        working-directory: klod
        run: python -m pip install -e '.[dev]'
      - name: Run backend unit and PostgreSQL integration tests
        working-directory: klod
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: klod/frontend
        run: npm install --no-audit --no-fund
      - name: Build mobile-first web app
        working-directory: klod/frontend
        run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend and browser-test dependencies
        working-directory: klod/frontend
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: klod/frontend
        run: npx playwright install --with-deps chromium
      - name: Run mobile and desktop browser acceptance tests
        working-directory: klod/frontend
        run: npm run test:e2e
      - name: Upload screenshots and Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klod-browser-evidence
          path: |
            klod/frontend/test-results/
            klod/frontend/playwright-report/
          if-no-files-found: warn

  android-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.build_android_candidate
    needs: [backend, frontend, browser-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce first eleven release gates
        run: python klod/scripts/release_gate.py --through 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: klod/frontend
        run: npm install --no-audit --no-fund
      - name: Build web bundle and generate native Android project
        working-directory: klod/frontend
        run: |
          npm run build
          npx cap add android
          npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble debug APK
        working-directory: klod/frontend/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r klod/frontend/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p ai.klod.app 1
            sleep 10
            adb shell uiautomator dump /sdcard/klod-window.xml
            adb shell cat /sdcard/klod-window.xml
            mkdir -p klod/frontend/test-results
            adb exec-out screencap -p > klod/frontend/test-results/klod-android-emulator.png
      - name: Upload installable APK and emulator evidence
        uses: actions/upload-artifact@v4
        with:
          name: klod-android-debug-candidate
          path: |
            klod/frontend/android/app/build/outputs/apk/debug/app-debug.apk
            klod/frontend/test-results/klod-android-emulator.png
          if-no-files-found: error

  android-development-apk:
    if: github.event_name == 'push'
    needs: [backend, frontend, browser-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: klod/frontend
        run: npm install --no-audit --no-fund
      - name: Build development web bundle
        working-directory: klod/frontend
        run: npm run build
      - name: Generate native Android project
        working-directory: klod/frontend
        run: |
          npx cap add android
          npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble development debug APK
        working-directory: klod/frontend/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Install and launch development APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r klod/frontend/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p ai.klod.app 1
            sleep 10
            adb shell uiautomator dump /sdcard/klod-window.xml
            adb shell cat /sdcard/klod-window.xml
            mkdir -p klod/frontend/test-results
            adb exec-out screencap -p > klod/frontend/test-results/klod-development-android.png
      - name: Upload development APK and emulator evidence
        uses: actions/upload-artifact@v4
        with:
          name: klod-development-debug-apk
          path: |
            klod/frontend/android/app/build/outputs/apk/debug/app-debug.apk
            klod/frontend/test-results/klod-development-android.png
          if-no-files-found: error
