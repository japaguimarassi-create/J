name: MotionForge Cloud Backend Checks

on:
  push:
    branches: ["motionforge-editor"]
    paths:
      - "cloud_backend.py"
      - "render.yaml"
      - ".github/workflows/cloud-backend-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend
        run: python -m py_compile cloud_backend.py
      - name: Run backend unit tests
        run: python -m unittest discover -s tests -p "test_cloud_backend.py" -v
      - name: Verify deployment configuration
        run: |
          test -s render.yaml
          grep -q "GITHUB_MODELS_TOKEN" render.yaml
          grep -q "MOTIONFORGE_API_KEY" render.yaml
