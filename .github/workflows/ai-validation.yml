name: Kowork AI validation and mesh smoke training

on:
  push:
    branches:
      - kowork-10b-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout AI core
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "sentencepiece>=0.2.0"
          python -m pip install "torch>=2.5.1" --index-url https://download.pytorch.org/whl/cpu

      - name: Verify exact 10B architecture count
        run: python -m ai.verify_config

      - name: Run unit and safety tests
        run: python -m unittest discover -s tests -v

      - name: Validate all 100 mesh queues
        run: |
          python -c 'import json; p=json.load(open("ai/mesh_plan.json")); assert p["mesh_count"] == 100; assert p["sessions_per_mesh"] == 400000000; assert p["target_sessions"] == p["mesh_count"] * p["sessions_per_mesh"]; print("planned_sessions=", p["target_sessions"])'

      - name: Build local source corpus and tokenizer
        run: python -m ai.prepare_data --source ai --output-dir data/smoke --vocab-size 512 --max-corpus-mib 16

      - name: Execute 50 real CPU sessions with the mesh scheduler
        run: |
          OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m ai.train --profile smoke --tokens data/smoke/train.bin --validation-tokens data/smoke/valid.bin --tokenizer data/smoke/kowork.model --steps 50 --sequence-length 64 --batch-size 1 --gradient-accumulation 1 --learning-rate 0.0003 --min-learning-rate 0.00003 --warmup-steps 5 --checkpoint-every 10 --eval-every 10 --eval-batches 2 --device cpu --output checkpoints/smoke.pt

      - name: Load trained checkpoint and generate sample
        run: |
          OMP_NUM_THREADS=1 python -m ai.generate --checkpoint checkpoints/smoke.pt --tokenizer data/smoke/kowork.model --prompt "def " --max-new-tokens 32 --device cpu > smoke-generation.txt
          test -s smoke-generation.txt
          cat smoke-generation.txt

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kowork-ai-smoke
          path: |
            checkpoints/smoke.pt
            checkpoints/smoke.metrics.jsonl
            data/smoke/corpus.txt
            data/smoke/valid.txt
            data/smoke/kowork.model
            data/smoke/train.bin
            data/smoke/valid.bin
            smoke-generation.txt
          if-no-files-found: ignore
          retention-days: 7
