name: Build RokaLauncher APK

on:
  push:
    branches:
      - build-rokalauncher-apk
    paths:
      - ".github/workflows/rokalauncher-apk.yml"
      - "rokalauncher-build/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rokalauncher-apk-build
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out isolated build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Fetch real MojoLauncher source
        run: |
          git clone --filter=blob:none https://github.com/MojoLauncher/MojoLauncher.git upstream
          git -C upstream checkout --detach 88ae67b49bb4dba5af42021a656bdf2e8d58d110
          git -C upstream submodule update --init --recursive

      - name: Restore RokaLauncher signing key
        run: |
          base64 --decode rokalauncher-build/signing/rokalauncher-debug.keystore.b64 > rokalauncher-build/signing/rokalauncher-debug.keystore
          keytool -list -keystore rokalauncher-build/signing/rokalauncher-debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Apply RokaLauncher branding
        run: python3 rokalauncher-build/scripts/brand_mojo.py upstream

      - name: Compile signed APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :app_mojo:assembleFullRelease --no-daemon --stacktrace

      - name: Verify APK and calculate checksum
        run: |
          mkdir -p out
          APK="$(find upstream/app_mojo/build/outputs/apk/full/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" out/RokaLauncher.apk
          test -s out/RokaLauncher.apk
          file out/RokaLauncher.apk
          sha256sum out/RokaLauncher.apk | tee out/RokaLauncher.apk.sha256
          unzip -t out/RokaLauncher.apk
          test -s out/RokaLauncher.apk.sha256

      - name: Upload RokaLauncher APK
        uses: actions/upload-artifact@v4
        with:
          name: RokaLauncher-APK
          path: out/RokaLauncher.apk*
          if-no-files-found: error
          retention-days: 30
