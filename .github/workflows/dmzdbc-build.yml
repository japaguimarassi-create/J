name: DMZ-DBC Build

on:
  push:
    branches:
      - dmz-dbc-addon-v0.1.0
    paths:
      - 'dragonminez-dbc-addon/**'
      - '.github/workflows/dmzdbc-build.yml'
  pull_request:
    paths:
      - 'dragonminez-dbc-addon/**'
      - '.github/workflows/dmzdbc-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'
      - name: Compile addon
        run: gradle build --no-daemon
        working-directory: dragonminez-dbc-addon
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: dragonminez-dbc-addon-0.1.0
          path: dragonminez-dbc-addon/build/libs/*.jar
          if-no-files-found: error
