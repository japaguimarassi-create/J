name: PS4 14.02 Host Lab checks

on:
  push:
    paths:
      - "ps4-1402-lab/**"
      - ".github/workflows/ps4-1402-lab.yml"
  pull_request:
    paths:
      - "ps4-1402-lab/**"
      - ".github/workflows/ps4-1402-lab.yml"
  workflow_dispatch:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ps4-1402-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static integrity tests
        run: npm test
