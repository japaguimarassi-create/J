$('step').onclick=()=>tick();$('speed').onchange=()=>{};$('camera').onclick=()=>{controls.reset();camera.position.set(30,29,38)};$('save').onclick=async()=>{if(await saveWorld())log('Mundo salvo neste navegador.')};$('load').onclick=async()=>{if(!await loadWorld())log('Nenhum salvamento encontrado.')};$('modelFile').addEventListener('change',e=>importHumanoid(e.target.files[0]));$('animationFiles').addEventListener('change',e=>importAnimationFiles(e.target.files));$('reset').onclick=async()=>{await clearSavedWorld();selected=null;$('inspect').style.display='none';$('feed').innerHTML='';init();updateUI()};
loadWorld().then(loaded=>{if(!loaded)init();$('hint').style.display='none';updateUI()}).catch(error=>{init();$('hint').style.display='none';log('Iniciando mundo novo: '+error.message)});addEventListener('beforeunload',()=>{saveWorld()});
let last=0,acc=0;function frame(t){requestAnimationFrame(frame);const dt=Math.min((t-last)/1000,.05);last=t;if(running){acc+=dt*Number($('speed').value)*5;while(acc>=1){tick();acc-=1}}for(const a of animals){a.x+=Math.sin(t*.0003+a.z)*.001;a.mesh.position.set(a.x,terrainHeight(a.x,a.z),a.z);a.mesh.rotation.y=Math.sin(t*.0005+a.z)*.08}for(const p of population)if(p.mixer)p.mixer.update(dt);controls.update();renderer.render(scene,camera)}requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
