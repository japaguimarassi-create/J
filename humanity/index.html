{name:'arado',needs:['domesticacao','carpintaria'],cost:{wood:18},skill:'farm',level:.42},
{name:'roda',needs:['carpintaria','ceramica'],cost:{wood:20,stone:4},skill:'craft',level:.48},
{name:'metalurgia do cobre',needs:['ceramica','ferramentas de pedra'],cost:{ore:5,wood:15},skill:'craft',level:.62},
{name:'escrita',needs:['ceramica','irrigacao'],cost:{fiber:12},skill:'craft',level:.68}
];
function log(s){const d=document.createElement('div');d.textContent='D'+day+' · '+s;$('feed').prepend(d);while($('feed').children.length>14)$('feed').lastChild.remove()}
function canPay(cost){return Object.entries(cost).every(([k,v])=>({wood,stone,clay,fiber,ore}[k]||0)>=v)}
function pay(cost){for(const [k,v] of Object.entries(cost)){if(k==='wood')wood-=v;if(k==='stone')stone-=v;if(k==='clay')clay-=v;if(k==='fiber')fiber-=v;if(k==='ore')ore-=v}}
function tryDiscover(p){if(p.discoveryCooldown>0)return false;const candidates=TECHS.filter(t=>!p.knowledge.includes(t.name)&&t.needs.every(n=>p.knowledge.includes(n))&&p.skill[t.skill]>=t.level&&canPay(t.cost));if(!candidates.length)return false;const t=candidates[Math.floor(Math.random()*candidates.length)];const chance=.00035+p.traits.curiosity*.0012+p.skill[t.skill]*.00045;if(Math.random()<chance){pay(t.cost);p.knowledge.push(t.name);p.discoveryCooldown=180;if(!techs.includes(t.name)){techs.push(t.name);showTechnology(t.name);log('Inovação: '+t.name+' foi descoberta por '+p.id)}else log('Habitante '+p.id+' aperfeiçoou o conhecimento de '+t.name);return true}return false}
function teachKnowledge(a,b){const available=a.knowledge.filter(k=>!b.knowledge.includes(k));if(!available.length)return false;const learned=available[Math.floor(Math.random()*available.length)];if(Math.random()<.035+a.traits.sociability*.045+b.traits.curiosity*.025){b.knowledge.push(learned);log('Conhecimento transmitido: '+b.id+' aprendeu '+learned+' com '+a.id);return true}return false}
function showTechnology(name){const index=techs.indexOf(name),g=new THREE.Group();g.position.set(19+(index%3)*2.2,0,-13+Math.floor(index/3)*3);const timber=mat(0x795336),clayMat=mat(0xa75f3d),metal=mat(0xb96e39),stoneMat=mat(0x777d78);if(name==='ceramica'){cylinder(g,0,.35,0,.38,.28,.7,clayMat,10);cylinder(g,0,.72,0,.39,.39,.08,clayMat,10)}else if(name==='ferramentas de pedra'){cylinder(g,0,.45,0,.045,.045,.9,timber,6);const head=new THREE.Mesh(new THREE.DodecahedronGeometry(.28),stoneMat);head.position.set(.12,.78,0);g.add(head)}else if(name==='tecelagem'){for(const x of [-.55,.55])box(g,x,.8,0,.1,1.6,.1,timber);for(let y=.25;y<1.55;y+=.22)box(g,0,y,0,1.1,.035,.06,mat(0xc7aa75))}else if(name==='irrigacao'){box(g,0,.06,0,2.3,.12,.45,mats.water);for(let x=-.8;x<=.8;x+=.8)box(g,x,.16,.36,.08,.3,.08,timber)}else if(name==='carpintaria'){box(g,0,.75,0,1.4,.15,.7,timber);for(const x of [-.55,.55])for(const z of [-.22,.22])box(g,x,.35,z,.1,.7,.1,timber)}else if(name==='arado'){box(g,0,.65,0,1.5,.12,.16,timber);box(g,.55,.3,0,.12,.65,.12,timber);box(g,-.7,.45,0,.1,.9,.1,timber)}else if(name==='roda'){const wheel=new THREE.Mesh(new THREE.TorusGeometry(.48,.09,8,16),timber);wheel.rotation.y=Math.PI/2;wheel.position.set(-.55,.6,0);g.add(wheel);box(g,.35,.55,0,1,.12,.6,timber)}else if(name==='metalurgia do cobre'){cylinder(g,0,.24,0,.6,.6,.35,stoneMat,8);const ingot=box(g,0,.55,0,.65,.16,.3,metal)}else if(name==='escrita'){box(g,0,.75,0,.9,1.1,.12,mat(0x92785a));for(let y=.55;y<1.15;y+=.2)box(g,0,y,.08,.55,.025,.025,mat(0x332c22))}world.add(g)}
function init(){createWorld();population=[];nextId=1;food=180;wood=50;stone=35;clay=8;fiber=12;ore=0;seeds=12;cropFields=[{progress:.65,x:11,z:10},{progress:.45,x:14,z:10}];houses=6;day=0;techs=[];for(let i=0;i<24;i++)population.push(new Person(nextId++,rand(16,48),Math.random()<.5?'F':'M'));log('A vila foi fundada por 24 pessoas.')}
function saveWorld(){try{const data={day,nextId,food,wood,stone,clay,fiber,ore,seeds,cropFields,houses,techs,population:population.map(p=>({id:p.id,age:p.age,sex:p.sex,parents:p.parents,health:p.health,hunger:p.hunger,energy:p.energy,social:p.social,skill:p.skill,traits:p.traits,partner:p.partner,children:p.children,cooldown:p.cooldown,discoveryCooldown:p.discoveryCooldown,knowledge:p.knowledge,x:p.x,z:p.z,action:p.action,brain:{w1:p.brain.w1,w2:p.brain.w2,baseline:p.brain.baseline,memory:p.brain.memory,fw1:p.brain.fw1,fw2:p.brain.fw2,predictionCount:p.brain.predictionCount}}))};localStorage.setItem('humanity-save-v1',JSON.stringify(data));return true}catch(e){log('Falha ao salvar: '+e.message);return false}}
function loadWorld(){try{const raw=localStorage.getItem('humanity-save-v1');if(!raw)return false;const d=JSON.parse(raw);world.clear();animals.length=0;createWorld();population=[];day=d.day||0;nextId=d.nextId||1;food=d.food??180;wood=d.wood??50;stone=d.stone??35;clay=d.clay??8;fiber=d.fiber??12;ore=d.ore??0;seeds=d.seeds??12;cropFields=d.cropFields||[];houses=d.houses??6;techs=d.techs||[];for(const tech of techs)showTechnology(tech);for(const s of d.population||[]){const p=new Person(s.id,s.age,s.sex,s.parents||[]);for(const key of ['health','hunger','energy','social','skill','traits','partner','children','cooldown','discoveryCooldown','knowledge','x','z','action'])if(s[key]!==undefined)p[key]=s[key];if(s.brain){p.brain.w1=s.brain.w1;p.brain.w2=s.brain.w2;p.brain.baseline=s.brain.baseline||0;p.brain.memory=s.brain.memory||[];if(s.brain.fw1)p.brain.fw1=s.brain.fw1;if(s.brain.fw2)p.brain.fw2=s.brain.fw2;p.brain.predictionCount=s.brain.predictionCount||0}p.mesh.position.set(p.x,p.mesh.userData.groundOffset||0,p.z);world.add(p.mesh);population.push(p)}selected=null;$('inspect').style.display='none';updateUI();log('Estado salvo restaurado.');return true}catch(e){log('Não foi possível carregar o salvamento: '+e.message);return false}}
async function parseCharacterAsset(file){const buffer=await file.arrayBuffer();if(file.name.toLowerCase().endsWith('.fbx')){const scene=fbxLoader.parse(buffer,'');return {scene,animations:scene.animations||[]}}return await loader.parseAsync(buffer,'')}
function rebuildHumans(){for(const p of population){world.remove(p.mesh);p.mixer=null;p.actions=null;p.currentClip=null;p.mesh=makeHuman(p);p.mesh.position.set(p.x,p.mesh.userData.groundOffset||0,p.z);world.add(p.mesh)}}
async function importHumanoid(file){if(!file)return;if(!/\\.(glb|fbx)$/i.test(file.name)){log('Use GLB ou FBX com esqueleto humanoide.');return}try{const gltf=await parseCharacterAsset(file);humanoidTemplate=gltf.scene;humanoidClips=gltf.animations||[];modelLabel=file.name;humanoidTemplate.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});rebuildHumans();$('sub').textContent='MODELO: '+modelLabel+' · '+humanoidClips.length+' ANIMAÇÕES';log('Modelo humano importado: '+file.name+' ('+humanoidClips.length+' animações embutidas).')}catch(error){log('Falha ao importar modelo: '+error.message)}}
async function importAnimationFiles(files){if(!files||!files.length)return;if(!humanoidTemplate){log('Importe primeiro o modelo humano com rig.');return}let added=0;for(const file of files){try{const gltf=await parseCharacterAsset(file);const clips=gltf.animations||[];for(const clip of clips){if(!humanoidClips.some(existing=>existing.name===clip.name)){humanoidClips.push(clip);added++}}}catch(error){log('Falha em '+file.name+': '+error.message)}}rebuildHumans();$('sub').textContent='MODELO: '+modelLabel+' · '+humanoidClips.length+' ANIMAÇÕES';log(added+' animações adicionadas. Requer esqueleto compatível.')}

function birth(){const females=population.filter(p=>p.sex==='F'&&p.age>=18&&p.age<43&&p.partner!==null&&p.cooldown===0);for(const m of females){const father=population.find(p=>p.id===m.partner);const fertility=m.age<36?1:Math.max(.15,1-(m.age-35)*.12);if(father&&father.age>=18&&father.age<65&&Math.random()<.00018*fertility&&food>45&&population.length<180){const child=new Person(nextId++,0,Math.random()<.5?'F':'M',[m.id,father.id]);child.health=rand(.82,1);child.hunger=.08;child.energy=.85;child.x=m.x+rand(-1,1);child.z=m.z+rand(-1,1);child.mesh.position.set(child.x,child.mesh.userData.groundOffset||0,child.z);for(const trait of Object.keys(child.traits))child.traits[trait]=clamp((m.traits[trait]+father.traits[trait])/2+rand(-.08,.08),0,1);for(const skill of Object.keys(child.skill))child.skill[skill]=clamp((m.skill[skill]+father.skill[skill])*.25+rand(-.025,.025),0,1);population.push(child);m.children++;m.cooldown=2600;father.cooldown=900;food-=10;log('Nasceu '+(child.sex==='F'?'uma menina':'um menino')+' de '+m.id+' e '+father.id+'. População: '+population.length)}}}
function technology(){for(const p of population){if(p.knowledge.includes('plantio')&&p.skill.farm>.2&&Math.random()<.00015)p.skill.farm=clamp(p.skill.farm+.0001,0,1);if(p.knowledge.includes('ferramentas de pedra')&&p.skill.craft>.1&&Math.random()<.0001)p.skill.craft=clamp(p.skill.craft+.0001,0,1)}}
function tick(){day++;waterNeed=.1+Math.random()*.1;const season=Math.floor((day%365)/91);const growth=[.035,.026,.008,0][season];for(const plot of cropFields)plot.progress=Math.min(1,plot.progress+growth);for(const p of [...population])p.update();birth();food=Math.max(0,food-.025*population.length);if(day%30===0){for(const a of animals){if(Math.random()<.4)food+=1}log('Passou um mês. Estoque de alimento: '+Math.floor(food))}technology();if(day%365===0)log('Ano '+Math.floor(day/365)+' concluído.');if(food<1&&Math.random()<.1){const p=population[Math.floor(Math.random()*population.length)];if(p)p.health-=.04}if(day%30===0)saveWorld();updateUI()}
function updateUI(){$('pop').textContent=population.length;$('year').textContent=(day/365).toFixed(1);$('food').textContent=Math.floor(food);$('tech').textContent=techs.length;$('sub').textContent='ERA DA VILA · '+modelLabel+' · MADEIRA '+Math.floor(wood)+' · PEDRA '+Math.floor(stone)+' · ARGILA '+Math.floor(clay)+' · FIBRA '+Math.floor(fiber)+' · SEMENTES '+seeds+' · CAMPOS '+cropFields.length;if(selected&&population.includes(selected)){$('inspect').style.display='block';$('inspect').innerHTML='<b>Habitante #'+selected.id+'</b><div class="metric"><span>Idade</span><b>'+selected.age.toFixed(1)+'</b></div><div class="metric"><span>Saúde</span><b>'+Math.round(selected.health*100)+'%</b></div><div class="metric"><span>Fome</span><b>'+Math.round(selected.hunger*100)+'%</b></div><div class="metric"><span>Energia</span><b>'+Math.round(selected.energy*100)+'%</b></div><div class="metric"><span>Social</span><b>'+Math.round(selected.social*100)+'%</b></div><div class="metric"><span>Ação</span><b>'+selected.action+'</b></div><div class="muted">Memórias: '+selected.brain.memory.length+' · Filhos: '+selected.children+'</div><div class="muted">Conhecimentos: '+selected.knowledge.join(', ')+'</div>'}}
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const meshes=population.flatMap(p=>p.mesh.children);const hit=raycaster.intersectObjects(meshes,true);if(hit.length){let root=hit[0].object;while(root&&!population.some(p=>p.mesh===root))root=root.parent;selected=population.find(p=>p.mesh===root)||null;updateUI()}});
$('toggle').onclick=()=>{running=!running;$('toggle').textContent=running?'Pausar':'Continuar'};
$('step').onclick=()=>tick();$('speed').onchange=()=>{};$('camera').onclick=()=>{controls.reset();camera.position.set(30,29,38)};$('save').onclick=()=>{if(saveWorld())log('Mundo salvo neste navegador.')};$('load').onclick=()=>{if(!loadWorld())log('Nenhum salvamento encontrado.')};$('modelFile').addEventListener('change',e=>importHumanoid(e.target.files[0]));$('animationFiles').addEventListener('change',e=>importAnimationFiles(e.target.files));$('reset').onclick=()=>{localStorage.removeItem('humanity-save-v1');selected=null;$('inspect').style.display='none';$('feed').innerHTML='';init();updateUI()};
if(!loadWorld())init();$('hint').style.display='none';updateUI();addEventListener('beforeunload',saveWorld);
let last=0,acc=0;function frame(t){requestAnimationFrame(frame);const dt=Math.min((t-last)/1000,.05);last=t;if(running){acc+=dt*Number($('speed').value)*5;while(acc>=1){tick();acc-=1}}for(const a of animals){a.mesh.position.x+=Math.sin(t*.0003+a.mesh.position.z)*.001}for(const p of population)if(p.mixer)p.mixer.update(dt);controls.update();renderer.render(scene,camera)}requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
