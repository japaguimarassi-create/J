[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deta-ai"
version = "0.3.0"
description = "Offline project generation, public web research, licensed-code training, and verification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["torch>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.11,<1"]

[project.scripts]
deta = "deta.cli:main"

[tool.setuptools.packages.find]
include = ["deta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
