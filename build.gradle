buildscript {
    repositories {
        mavenCentral()
        jcenter()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
    }
    dependencies {
        classpath("com.anatawa12.forge:ForgeGradle:1.2-1.1.1") {
            changing = true
        }
    }
}

apply plugin: "forge"

group = "br.com.japa.intx"
version = "0.1.0"
archivesBaseName = "intx"

sourceCompatibility = 1.8
targetCompatibility = 1.8

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
}

repositories {
    mavenCentral()
}

dependencies {
    compile "org.ow2.asm:asm-all:5.0.3"
    testCompile "junit:junit:4.13.2"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version
    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand "version": project.version, "mcversion": project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

jar {
    manifest {
        attributes(
            "FMLCorePlugin": "br.com.japa.intx.core.IntXLoadingPlugin",
            "FMLCorePluginContainsFMLMod": "true",
            "Implementation-Title": "IntX",
            "Implementation-Version": project.version
        )
    }
}
