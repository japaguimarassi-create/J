plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = project.mod_group
version = project.mod_version
base { archivesName = 'frameless-style-portals-forge-1.20.1' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { wormhole_portals { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories { mavenCentral() }
dependencies { minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}" }

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'forge_version', project.forge_version
    filesMatching('META-INF/mods.toml') { expand version: project.version, minecraft_version: project.minecraft_version, forge_version: project.forge_version }
}

jar {
    manifest { attributes([
        'Specification-Title': 'frameless_style_portals',
        'Specification-Vendor': 'Japa',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version
    ]) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

publishing { publications { mavenJava(MavenPublication) { from components.java } } }