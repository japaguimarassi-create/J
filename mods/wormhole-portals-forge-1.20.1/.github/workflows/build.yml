name: Forge 1.20.1 Build

on:
  push:
    branches:
      - main
      - frameless-portals-forge-1.20.1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Compile and package
        run: gradle --no-daemon clean build --stacktrace

      - name: Verify output JAR
        run: test -s build/libs/wormhole-portals-forge-1.20.1-0.2.0-alpha.1.jar

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: wormhole-portals-forge-1.20.1
          path: build/libs/wormhole-portals-forge-1.20.1-0.2.0-alpha.1.jar
          if-no-files-found: error
          retention-days: 30
