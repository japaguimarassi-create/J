name: Forge 1.20.1 Native Build
on:
  push:
    branches:
      - frameless-portals-forge-1.20.1-native
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge-native-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - run: gradle --no-daemon clean build --stacktrace
        working-directory: mods/wormhole-portals-forge-1.20.1
      - uses: actions/upload-artifact@v4
        with:
          name: frameless-style-portals-forge-1.20.1
          path: mods/wormhole-portals-forge-1.20.1/build/libs/frameless-style-portals-forge-1.20.1-0.3.0-alpha.1.jar
          if-no-files-found: error
          retention-days: 30