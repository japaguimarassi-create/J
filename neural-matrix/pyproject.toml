[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-matrix-1b2b"
version = "0.1.0"
description = "Hybrid sparse and virtual neural architecture research prototype"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
neural-matrix = "neural_matrix.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
